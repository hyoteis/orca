<!doctype html>
<!--
  PROTOTYPE — throwaway(#125 "Prototype the C++ Configure Code workflow")
  迭代 3(用户反馈 2026-09-08):配置对象 = 工作区本身。一个工作区一个模式
  (一个 compile_commands.json 或 BASIC), 不做任何逐文件夹配置。
  完整三变体版见 commit 2b92940389;顶层文件夹版见迭代 2(本文件历史)。

  场景:SSH/本机主机切换 × CDB 状态演示循环(有效 → 降级保留 last-valid → 部分覆盖)
  × 模式切换(结构变更 → 重新授权)× BASIC 选项(#123: basicOptions per scope)。
  Token 取自 src/renderer/src/assets/main.css;双击打开即用;内存态, 刷新重置。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>PROTOTYPE · Configure Code 工作流 · 工作区级</title>
<style>
  :root, .light {
    --background:#fff; --foreground:#0a0a0a; --card:#fff; --card-foreground:#0a0a0a;
    --popover:#fff; --primary:#171717; --primary-foreground:#fafafa;
    --secondary:#f5f5f5; --secondary-foreground:#171717;
    --muted:#f5f5f5; --muted-foreground:#737373;
    --accent:#f5f5f5; --accent-foreground:#171717;
    --destructive:#e40014; --destructive-foreground:#fcf3f3;
    --border:#e5e5e5; --input:#e5e5e5; --ring:#737373;
    --radius:0.625rem; --status-success:#15803d; --warning:#b45309;
  }
  .dark {
    --background:#0a0a0a; --foreground:#fafafa; --card:#171717; --card-foreground:#fafafa;
    --popover:#171717; --primary:#e5e5e5; --primary-foreground:#171717;
    --secondary:#262626; --secondary-foreground:#fafafa;
    --muted:#262626; --muted-foreground:#a1a1a1;
    --accent:#404040; --accent-foreground:#fafafa;
    --destructive:#ff6568; --destructive-foreground:#df2225;
    --border:rgb(255 255 255 / 0.07); --input:rgb(255 255 255 / 0.15); --ring:#737373;
    --status-success:#86efac; --warning:#f59e0b;
  }
  * { box-sizing:border-box; margin:0; }
  svg { width:1em; height:1em; flex:none; }
  html,body { height:100%; }
  body {
    font-family:'Geist',-apple-system,'Segoe UI',system-ui,sans-serif;
    font-size:14px; letter-spacing:0.01em; color:var(--foreground);
    background:color-mix(in srgb, var(--foreground) 4%, var(--background));
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .proto-tag {
    position:fixed; top:10px; left:12px; font-size:10px; font-weight:600;
    text-transform:uppercase; letter-spacing:.08em; color:var(--muted-foreground);
    border:1px dashed var(--border); border-radius:999px; padding:2px 8px; background:var(--card);
  }
  .dialog {
    width:100%; max-width:36rem; max-height:calc(100vh - 120px);
    display:flex; flex-direction:column;
    background:var(--card); border:1px solid var(--border); border-radius:calc(var(--radius)*1.4);
    box-shadow:0 10px 24px rgba(0,0,0,.18);
  }
  .dlg-head { padding:16px 20px 8px; }
  .dlg-title { font-size:15px; font-weight:600; }
  .dlg-desc { margin-top:3px; font-size:12px; color:var(--muted-foreground); line-height:1.5; }
  .dlg-body { padding:8px 20px 12px; overflow-y:auto; display:flex; flex-direction:column; gap:14px; }
  .dlg-foot { padding:12px 20px 16px; display:flex; align-items:center; gap:8px; justify-content:flex-end; }
  .host-line { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted-foreground); flex-wrap:wrap; }
  .host-badge {
    display:inline-flex; align-items:center; gap:5px; padding:1px 8px; font-size:11px; font-weight:600;
    border:1px solid var(--border); border-radius:999px; color:var(--foreground);
    background:color-mix(in srgb, var(--muted-foreground) 8%, transparent);
  }
  /* the single workspace row */
  .ws-row { border:1px solid var(--border); border-radius:var(--radius); background:var(--card); }
  .ws-main { display:flex; align-items:center; gap:8px; padding:9px 12px; }
  .ws-name { display:flex; align-items:center; gap:7px; flex:1; min-width:0; }
  .ws-name svg { color:var(--muted-foreground); }
  .ws-nm { font-family:ui-monospace,Consolas,monospace; font-size:13px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ws-sub { font-size:11px; color:var(--muted-foreground); font-family:ui-monospace,Consolas,monospace; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ws-detail { border-top:1px solid var(--border); padding:10px 12px; display:flex; flex-direction:column; gap:8px; }
  .detail-grid { display:flex; align-items:center; gap:8px; font-size:12px; min-width:0; }
  .detail-grid label { color:var(--muted-foreground); flex:none; width:5.5em; }
  .field {
    flex:1; min-width:0; font-family:ui-monospace,Consolas,monospace; font-size:12px;
    background:color-mix(in srgb, var(--foreground) 4%, transparent);
    border:1px solid var(--input); border-radius:calc(var(--radius)*0.6); padding:4px 8px;
    color:var(--foreground); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  textarea.field {
    height:auto; font-size:12px; resize:vertical; min-height:44px; white-space:pre; line-height:1.5;
    overflow:auto; text-overflow:clip;
  }
  select.field { font-family:inherit; }
  /* buttons */
  .btn {
    display:inline-flex; align-items:center; gap:6px; font:inherit; font-size:13px;
    padding:0 12px; height:30px; border-radius:calc(var(--radius)*0.8); cursor:pointer;
    border:1px solid transparent; background:transparent; color:var(--foreground);
  }
  .btn-primary { background:var(--primary); color:var(--primary-foreground); font-weight:500; }
  .btn-outline { border-color:var(--border); background:var(--card); }
  .btn-outline:hover { background:var(--accent); }
  .btn-ghost { color:var(--muted-foreground); padding:0 8px; }
  .btn-ghost:hover { background:var(--accent); color:var(--foreground); }
  .btn-sm { height:24px; font-size:12px; padding:0 8px; }
  /* chips */
  .chip {
    display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:500;
    padding:1px 8px; border-radius:999px; border:1px solid var(--border);
    color:var(--muted-foreground); white-space:nowrap;
  }
  .chip svg { width:11px; height:11px; }
  .chip-ok { color:var(--status-success); border-color:color-mix(in srgb, var(--status-success) 25%, transparent); background:color-mix(in srgb, var(--status-success) 10%, transparent); }
  .chip-warn { color:var(--warning); border-color:color-mix(in srgb, var(--warning) 25%, transparent); background:color-mix(in srgb, var(--warning) 10%, transparent); }
  .chip-degraded { color:var(--warning); border-color:color-mix(in srgb, var(--warning) 52%, transparent); background:color-mix(in srgb, var(--warning) 12%, transparent); }
  .chip-basic { color:var(--muted-foreground); }
  /* segmented */
  .seg { display:inline-flex; border:1px solid var(--border); border-radius:calc(var(--radius)*0.8); padding:2px; gap:2px; background:var(--muted); }
  .seg button { font:inherit; font-size:12px; padding:3px 10px; border-radius:calc(var(--radius)*0.5); border:0; background:transparent; color:var(--muted-foreground); cursor:pointer; }
  .seg button[aria-pressed="true"] { background:var(--card); color:var(--foreground); box-shadow:0 1px 2px rgba(0,0,0,.12); font-weight:500; }
  /* status lines */
  .vstat { display:flex; align-items:flex-start; gap:6px; font-size:12px; line-height:1.45; }
  .vstat svg { width:13px; height:13px; margin-top:2px; }
  .vstat.ok { color:var(--status-success); }
  .vstat.ok span { color:var(--foreground); }
  .vstat.warn { color:var(--warning); }
  .vstat.warn span { color:var(--foreground); }
  .vstat.bad { color:var(--destructive); }
  .vstat.neutral { color:var(--muted-foreground); }
  .vstat.neutral span { color:var(--foreground); }
  .note { font-size:11px; color:var(--muted-foreground); line-height:1.5; }
  /* forms */
  .form-grid { display:grid; grid-template-columns:auto 1fr; gap:7px 10px; align-items:center; font-size:12px; }
  .form-grid label { color:var(--muted-foreground); text-align:right; }
  .reauth {
    display:flex; gap:8px; align-items:center; font-size:11px; color:var(--muted-foreground);
    margin-right:auto; line-height:1.4;
  }
  /* switcher */
  .switcher {
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%); z-index:100;
    display:flex; align-items:center; gap:4px; padding:5px 8px;
    background:var(--popover); color:var(--popover-foreground);
    border:1px solid var(--border); border-radius:999px; box-shadow:0 10px 24px rgba(0,0,0,.25);
    font-size:12px;
  }
  .switcher button {
    height:26px; border-radius:999px; display:inline-flex; align-items:center; justify-content:center;
    border:0; background:transparent; color:var(--muted-foreground); cursor:pointer; font:inherit; padding:0 8px;
  }
  .switcher button:hover { background:var(--accent); color:var(--foreground); }
  .switcher .lbl { padding:0 6px; font-weight:500; }
  .switcher .host-toggle { font-size:11px; font-family:ui-monospace,Consolas,monospace; }
  .switcher .scn-toggle { font-size:11px; }
  /* toast */
  .toast {
    position:fixed; top:18px; right:18px; z-index:200; font-size:12px; line-height:1.5;
    background:var(--popover); color:var(--popover-foreground);
    border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:0 10px 24px rgba(0,0,0,.25); padding:10px 14px; max-width:320px;
  }
</style>
</head>
<body>
<div class="proto-tag">Prototype · throwaway · #125 · 工作区级</div>
<div id="stage"></div>
<div class="switcher" id="switcher"></div>
<script>
'use strict'

// ---------- icons (lucide paths) ----------
const I = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.46 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>',
  refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>',
  folder: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>',
  server: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><path d="M6 6h.01M6 18h.01"/></svg>',
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.3 11.3 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>',
  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>'
}

// ---------- stub scenario ----------
const HOSTS = {
  local: {
    label: '本机 (Windows)', kind: 'local', name: 'DiligentCore',
    workspace: 'D:\\src\\DiligentCore',
    db: 'D:\\build\\vulkan\\compile_commands.json',
    include: '-I D:\\sdk\\include'
  },
  ssh: {
    label: 'build-server', kind: 'ssh', name: 'DiligentCore',
    workspace: '/home/dev/DiligentCore',
    db: '/home/dev/build/vulkan/compile_commands.json',
    include: '-I /opt/sdk/include'
  }
}
// CDB 状态演示循环:ok → degraded → partial
const SCENARIOS = ['ok', 'degraded', 'partial']
const SCN_LABEL = { ok: '正常', degraded: '降级', partial: '部分覆盖' }

// ---------- state ----------
const state = {
  host: 'ssh', dark: true,
  mode: 'cdb',            // 'cdb' | 'basic'
  scenario: 0,            // index into SCENARIOS
  reauth: false,
  reloaded: false         // reload 已在当前降级场景演示过
}

// ---------- render ----------
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))

function chip() {
  if (state.mode === 'basic') return '<span class="chip chip-basic">BASIC 索引</span>'
  const s = SCENARIOS[state.scenario]
  if (s === 'degraded') return '<span class="chip chip-degraded">' + I.pause + '降级 · 保留最后有效</span>'
  if (s === 'partial') return '<span class="chip chip-warn">' + I.warn + '部分覆盖</span>'
  return '<span class="chip chip-ok">' + I.check + '有效</span>'
}

function vstat() {
  if (state.mode === 'basic')
    return '<div class="vstat neutral">' + I.folder + '<span>BASIC 索引 — 用下方选项为工作区合成编译命令,无需数据库。</span></div>'
  const s = SCENARIOS[state.scenario]
  if (s === 'degraded')
    return state.reloaded
      ? '<div class="vstat bad">' + I.x + '<span>重新验证失败:文件不存在。已保留最后有效映射(有效期至 2026-09-07 21:14),代码智能继续可用。</span></div>'
      : '<div class="vstat warn">' + I.pause + '<span>数据库已删除或损坏。沿用最后有效映射(有效期至 2026-09-07 21:14);恢复文件或重新指向后重载。</span></div>'
  if (s === 'partial')
    return '<div class="vstat warn">' + I.warn + '<span>JSON 结构有效 · 527 条命令 · 覆盖 88/120 个顶层源文件 — 未覆盖文件由 clangd 推断命令,不阻塞启用。</span></div>'
  return '<div class="vstat ok">' + I.check + '<span>JSON 结构有效 · 527 条命令 · 覆盖 512/512 个源文件。</span></div>'
}

function basicOptions() {
  const host = HOSTS[state.host]
  return `<div class="form-grid">
    <label>include 路径</label><textarea class="field" rows="2">${esc(host.include)}\n-I ${esc(state.host === 'local' ? 'D:\\sdk\\gli' : '/opt/sdk/gli')}</textarea>
    <label>宏定义</label><textarea class="field" rows="1">MALEOON_SUPPORTED=1</textarea>
    <label>C++ 标准</label>
    <select class="field" style="width:9rem;flex:none"><option>C++17</option><option selected>C++20</option><option>C++23</option></select>
  </div>`
}

function render() {
  document.body.className = state.dark ? 'dark' : 'light'
  const host = HOSTS[state.host]
  const cdb = state.mode === 'cdb'
  document.getElementById('stage').innerHTML = `
  <div class="dialog" role="dialog" aria-label="配置 C++ 代码智能">
    <div class="dlg-head">
      <div class="dlg-title">配置 C++ 代码智能</div>
      <div class="dlg-desc">为整个工作区选择一种模式:提供的 compile_commands.json,或 BASIC 索引。数据库可位于${host.kind === 'ssh' ? '远程主机' : '本机'}任意位置,须与工作区同一执行主机。</div>
    </div>
    <div class="dlg-body">
      <div class="host-line">
        <span class="host-badge">${I.server}${esc(host.label)}</span>
        <span class="ws-sub">${esc(host.workspace)}</span>
      </div>
      <div class="ws-row">
        <div class="ws-main">
          <div class="ws-name">${I.folder}
            <div style="min-width:0">
              <div class="ws-nm">${esc(host.name)}</div>
            </div>
          </div>
          <div class="seg" role="group" aria-label="模式">
            <button data-a="mode" data-mode="cdb" aria-pressed="${cdb}">编译数据库</button>
            <button data-a="mode" data-mode="basic" aria-pressed="${!cdb}">BASIC</button>
          </div>
          ${chip()}
        </div>
        <div class="ws-detail">
          ${cdb ? `
          <div class="detail-grid"><label>数据库</label>
            <input class="field" readonly value="${esc(host.db)}">
            <button class="btn btn-outline btn-sm" data-a="browse">浏览…</button></div>
          ${vstat()}
          <div>
            <button class="btn btn-outline btn-sm" data-a="reload">${I.refresh}重新验证并重载</button>
          </div>` : `
          ${vstat()}
          <div class="detail-grid" style="align-items:flex-start"><label style="padding-top:4px">BASIC 选项</label>
            <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:7px">${basicOptions()}</div></div>
          <div class="note">对整个工作区生效(#123:basicOptions 按作用域持久化);编译数据库模式不使用这些设置。</div>`}
        </div>
      </div>
      <div class="note">${cdb
        ? '数据库内容变化会自动刷新,无需重新授权;更换数据库或切换模式属结构变更,保存后需重新授权。'
        : '切换到编译数据库或改这些选项属结构变更,保存后需重新授权。'}</div>
    </div>
    <div class="dlg-foot">
      ${state.reauth
        ? `<div class="reauth">${I.gear} 结构已变更 — 保存后将请求重新授权</div>`
        : ''}
      <button class="btn btn-outline" data-a="noop">取消</button>
      <button class="btn btn-primary" data-a="save">保存并授权</button>
    </div>
  </div>`
  document.getElementById('switcher').innerHTML =
    `<span class="lbl">${I.folder} 工作区级 · 单行</span>
     <button class="host-toggle" data-sw="host" title="切换执行主机">${state.host === 'ssh' ? I.server + ' SSH · build-server' : '⌂ 本机 · Windows'}</button>
     <button class="scn-toggle" data-sw="scenario" title="演示数据库状态循环">状态:${SCN_LABEL[SCENARIOS[state.scenario]]}</button>
     <button data-sw="theme" aria-label="切换主题">${state.dark ? I.sun : I.moon}</button>`
}

function toast(html) {
  const el = document.createElement('div')
  el.className = 'toast'
  el.innerHTML = html
  document.body.appendChild(el)
  setTimeout(() => el.remove(), 2600)
}

document.addEventListener('click', (e) => {
  const sw = e.target.closest('[data-sw]')
  if (sw) {
    const act = sw.dataset.sw
    if (act === 'host') { state.host = state.host === 'ssh' ? 'local' : 'ssh'; state.reauth = false; state.reloaded = false }
    else if (act === 'scenario') { state.scenario = (state.scenario + 1) % SCENARIOS.length; state.reloaded = false }
    else state.dark = !state.dark
    render()
    return
  }
  const b = e.target.closest('[data-a]')
  if (!b) return
  const a = b.dataset.a
  if (a === 'mode') { state.mode = b.dataset.mode; state.reauth = true; state.reloaded = false }
  else if (a === 'reload') {
    state.reloaded = true
    const s = SCENARIOS[state.scenario]
    toast(s === 'degraded'
      ? '重新验证失败:文件不存在 — 保留最后有效映射,代码智能继续可用'
      : '已重新验证并重载:<b>' + esc(HOSTS[state.host].db) + '</b>(内容变化,无需重新授权)')
  }
  else if (a === 'browse') { toast('打开' + (state.host === 'ssh' ? ' <b>' + esc(HOSTS[state.host].label) + '</b> 远程主机' : '本机') + '文件浏览器选择 compile_commands.json(原型 stub)') }
  else if (a === 'save') {
    toast('<b>已保存</b> · ' + HOSTS[state.host].name + ' · ' + (state.mode === 'cdb' ? '编译数据库' : 'BASIC 索引') + (state.reauth ? ' · 结构变更,已记录重新授权' : ''))
    state.reauth = false
  }
  render()
})

render()
</script>
</body>
</html>
